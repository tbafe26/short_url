<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 730" width="1290" height="730" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>숫자형 단축 URL 서비스 아키텍처</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2433"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <!-- 사람 아이콘 -->
    <g id="person">
      <circle cx="0" cy="-12" r="11" fill="none" stroke="#1f2433" stroke-width="3"/>
      <path d="M-20,20 a20,18 0 0 1 40,0 z" fill="none" stroke="#1f2433" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- 데이터베이스(원통) 아이콘 -->
    <g id="db">
      <ellipse cx="0" cy="-14" rx="18" ry="6" fill="#336791"/>
      <path d="M-18,-14 v26 a18,6 0 0 0 36,0 v-26 a18,6 0 0 1 -36,0 z" fill="#336791"/>
      <path d="M-18,-2 a18,6 0 0 0 36,0" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <ellipse cx="0" cy="-14" rx="18" ry="6" fill="#4b85b5"/>
    </g>
  </defs>

  <!-- 배경: GitHub 다크 모드에서도 읽히도록 흰 바탕을 둔다 -->
  <rect x="0" y="0" width="1290" height="730" rx="16" fill="#ffffff"/>

  <!-- ===== 개발자 ===== -->
  <use href="#person" x="90" y="80"/>
  <text x="90" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">개발자</text>

  <!-- ===== GitHub ===== -->
  <circle cx="330" cy="78" r="30" fill="#1f2433"/>
  <!-- git 브랜치 모양 -->
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="320" y1="64" x2="320" y2="92"/>
    <path d="M340,68 v6 a10,10 0 0 1 -10,10 h-10"/>
  </g>
  <circle cx="320" cy="62" r="4.5" fill="#ffffff"/>
  <circle cx="320" cy="94" r="4.5" fill="#ffffff"/>
  <circle cx="340" cy="64" r="4.5" fill="#ffffff"/>
  <text x="330" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">GitHub</text>
  <text x="330" y="149" text-anchor="middle" font-size="12.5" fill="#5b6273">tbafe26/short_url</text>

  <!-- 개발자 → GitHub -->
  <line x1="130" y1="78" x2="290" y2="78" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="210" y="68" text-anchor="middle" font-size="13" font-style="italic" fill="#5b6273">git push</text>

  <!-- GitHub → Railway (자동 배포) -->
  <path d="M362,78 H1025 V206" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="700" y="68" text-anchor="middle" font-size="13" font-style="italic" fill="#5b6273">main에 push하면 자동 빌드·배포 (Dockerfile, railway.json)</text>

  <!-- 개발자 → Cloudflare (수동 배포) -->
  <path d="M90,152 V178 H450 V206" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="560" y="182" text-anchor="middle" font-size="13" font-style="italic" fill="#5b6273">npx wrangler deploy</text>

  <!-- ===== 사용자 ===== -->
  <g transform="translate(90,405)">
    <use href="#person" x="-24" y="-8"/>
    <use href="#person" x="24" y="-8"/>
    <g transform="translate(0,22)"><use href="#person"/></g>
  </g>
  <text x="90" y="475" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">사용자</text>
  <text x="90" y="494" text-anchor="middle" font-size="12.5" fill="#5b6273">브라우저 · 시크릿 창</text>

  <!-- 사용자 ↔ Cloudflare -->
  <line x1="140" y1="390" x2="256" y2="390" stroke="#1f2433" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="198" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2433">HTTPS</text>

  <!-- ===== 원본 사이트 ===== -->
  <g transform="translate(90,640)">
    <circle r="24" fill="none" stroke="#1f2433" stroke-width="2.5"/>
    <ellipse rx="11" ry="24" fill="none" stroke="#1f2433" stroke-width="2"/>
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#1f2433" stroke-width="2"/>
    <path d="M-20,-12 H20 M-20,12 H20" stroke="#1f2433" stroke-width="1.6"/>
  </g>
  <text x="90" y="686" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">원본 URL 사이트</text>

  <!-- 사용자 → 원본 사이트 -->
  <line x1="90" y1="506" x2="90" y2="608" stroke="#1f2433" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="104" y="552" font-size="12.5" fill="#1f2433">301 Location을</text>
  <text x="104" y="569" font-size="12.5" fill="#1f2433">따라 이동</text>

  <!-- ===== Cloudflare ===== -->
  <rect x="260" y="210" width="400" height="360" rx="10" fill="#fff8f1" stroke="#f38020" stroke-width="2"/>
  <rect x="260" y="210" width="62" height="52" rx="10" fill="#f38020"/>
  <rect x="300" y="210" width="22" height="52" fill="#f38020"/>
  <!-- 구름 아이콘 -->
  <path d="M276,248 a9,9 0 0 1 3,-17 a12,12 0 0 1 22,-4 a8,8 0 0 1 9,9 a6,6 0 0 1 0,12 z" fill="#ffffff"/>
  <text x="338" y="235" font-size="18" font-weight="700" fill="#1f2433">Cloudflare Workers</text>
  <text x="338" y="254" font-size="12.5" fill="#5b6273">short-url.tbafe.workers.dev · 공개 접점 · 무료</text>

  <!-- Worker 스크립트 -->
  <rect x="285" y="282" width="350" height="128" rx="8" fill="#ffffff" stroke="#f6a35c" stroke-width="1.5"/>
  <text x="302" y="307" font-size="15" font-weight="700" fill="#1f2433">Worker 스크립트</text>
  <text x="440" y="307" font-size="12.5" fill="#5b6273">cloudflare/src/worker.js</text>
  <text x="302" y="333" font-size="13" fill="#1f2433">• <tspan font-family="Consolas, monospace">/api/*</tspan>, <tspan font-family="Consolas, monospace">/{숫자}</tspan> → 백엔드로 프록시</text>
  <text x="302" y="356" font-size="13" fill="#1f2433">• 301 응답과 Location을 그대로 전달</text>
  <text x="302" y="379" font-size="13" fill="#1f2433">• 절전에서 깨어날 때 502·503이면 한 번 재시도</text>
  <text x="302" y="400" font-size="13" fill="#1f2433">• 그 밖의 경로 → 정적 파일</text>

  <!-- Worker → Static Assets -->
  <line x1="460" y1="410" x2="460" y2="446" stroke="#1f2433" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="472" y="433" font-size="12.5" font-style="italic" fill="#5b6273">env.ASSETS.fetch</text>

  <!-- Static Assets -->
  <rect x="285" y="450" width="350" height="100" rx="8" fill="#ffffff" stroke="#f6a35c" stroke-width="1.5"/>
  <text x="302" y="475" font-size="15" font-weight="700" fill="#1f2433">Static Assets · Dioxus 웹 화면</text>
  <text x="302" y="500" font-size="13" fill="#1f2433">• index.html · WASM · CSS (dx build)</text>
  <text x="302" y="523" font-size="13" fill="#1f2433">• URL 입력 → 생성 → 결과 표시 → 복사</text>
  <text x="302" y="543" font-size="12" fill="#5b6273">  같은 출처로 /api/links 호출 (CORS 없음)</text>

  <!-- Cloudflare ↔ Railway -->
  <line x1="635" y1="330" x2="787" y2="330" stroke="#1f2433" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="722" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2433">HTTPS 프록시</text>
  <text x="722" y="350" text-anchor="middle" font-size="11.5" fill="#5b6273">redirect: manual</text>
  <text x="722" y="366" text-anchor="middle" font-size="11.5" fill="#5b6273">BACKEND_ORIGIN</text>

  <!-- ===== Railway ===== -->
  <g transform="translate(50,0)">
  <rect x="740" y="210" width="470" height="360" rx="10" fill="#f7f4ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="740" y="210" width="62" height="52" rx="10" fill="#8b5cf6"/>
  <rect x="780" y="210" width="22" height="52" fill="#8b5cf6"/>
  <!-- 선로 아이콘 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="762" y1="226" x2="762" y2="248"/>
    <line x1="780" y1="226" x2="780" y2="248"/>
    <line x1="757" y1="231" x2="785" y2="231"/>
    <line x1="757" y1="237" x2="785" y2="237"/>
    <line x1="757" y1="243" x2="785" y2="243"/>
  </g>
  <text x="818" y="235" font-size="18" font-weight="700" fill="#1f2433">Railway</text>
  <text x="818" y="254" font-size="12.5" fill="#5b6273">shorturl-production-fb10.up.railway.app · 백엔드 + DB</text>

  <!-- 백엔드 -->
  <rect x="765" y="282" width="420" height="140" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <rect x="765" y="282" width="46" height="36" rx="8" fill="#2496ed"/>
  <rect x="790" y="282" width="21" height="36" fill="#2496ed"/>
  <g fill="#ffffff">
    <rect x="775" y="301" width="7" height="6"/><rect x="784" y="301" width="7" height="6"/><rect x="793" y="301" width="7" height="6"/>
    <rect x="784" y="293" width="7" height="6"/>
  </g>
  <text x="824" y="306" font-size="15" font-weight="700" fill="#1f2433">백엔드 (Docker)</text>
  <text x="950" y="306" font-size="12.5" fill="#5b6273">Rust · Dioxus 풀스택 서버 + axum</text>
  <text x="782" y="336" font-size="13" fill="#1f2433">• <tspan font-family="Consolas, monospace">POST /api/links</tspan> → 서버에서 URL 검증 후 <tspan font-weight="700">201</tspan></text>
  <text x="782" y="359" font-size="13" fill="#1f2433">• <tspan font-family="Consolas, monospace">GET /{n}</tspan> → <tspan font-weight="700">301</tspan> 원본 URL · 없거나 비정규형이면 <tspan font-weight="700">404</tspan></text>
  <text x="782" y="382" font-size="13" fill="#1f2433">• <tspan font-family="Consolas, monospace">PUT·PATCH·DELETE /api/links/{n}</tspan> → <tspan font-weight="700">405</tspan></text>
  <text x="782" y="405" font-size="13" fill="#1f2433">• 시작할 때 마이그레이션 자동 적용 (sqlx)</text>

  <!-- 백엔드 ↔ Postgres -->
  <line x1="975" y1="422" x2="975" y2="452" stroke="#1f2433" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="988" y="442" font-size="12.5" font-style="italic" fill="#5b6273">DATABASE_URL (변수 참조 · 내부망)</text>

  <!-- Postgres -->
  <rect x="765" y="456" width="420" height="96" rx="8" fill="#ffffff" stroke="#336791" stroke-width="1.5"/>
  <use href="#db" x="795" y="506"/>
  <text x="826" y="481" font-size="15" font-weight="700" fill="#1f2433">PostgreSQL 17</text>
  <text x="960" y="481" font-size="12.5" fill="#5b6273">링크 영구 저장 (볼륨)</text>
  <text x="826" y="506" font-size="13" fill="#1f2433">• <tspan font-family="Consolas, monospace">number</tspan> IDENTITY PRIMARY KEY → 번호 충돌 없음</text>
  <text x="826" y="529" font-size="13" fill="#1f2433">• UPDATE·DELETE·TRUNCATE 거부 트리거 → 불변</text>

  </g>

  <!-- ===== 범례 ===== -->
  <g transform="translate(790,612)">
    <rect x="0" y="0" width="470" height="78" rx="8" fill="#f5f6fa"/>
    <line x1="20" y1="28" x2="70" y2="28" stroke="#1f2433" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="82" y="33" font-size="13" fill="#1f2433">요청 흐름 (사용자 → 서비스)</text>
    <line x1="20" y1="54" x2="70" y2="54" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
    <text x="82" y="59" font-size="13" fill="#1f2433">배포 흐름 (개발자 → 플랫폼)</text>
    <text x="300" y="33" font-size="12.5" fill="#5b6273">운영 비용 0원</text>
    <text x="300" y="54" font-size="12.5" fill="#5b6273">비밀 값은 Railway 변수에만</text>
  </g>

  <!-- 요청 흐름 요약 -->
  <g transform="translate(260,612)">
    <rect x="0" y="0" width="400" height="78" rx="8" fill="#f5f6fa"/>
    <text x="18" y="26" font-size="13" font-weight="700" fill="#1f2433">단축 주소를 열면</text>
    <text x="18" y="47" font-size="12.5" fill="#1f2433">① 브라우저 → Worker <tspan font-family="Consolas, monospace">/27</tspan>  ② Worker → 백엔드 프록시</text>
    <text x="18" y="66" font-size="12.5" fill="#1f2433">③ 백엔드가 DB 조회 후 301  ④ 브라우저가 원본으로 이동</text>
  </g>
</svg>
