<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <title>숫자형 단축 URL 서비스 구성</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2433"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <g id="person">
      <circle cx="0" cy="-12" r="11" fill="none" stroke="#1f2433" stroke-width="3"/>
      <path d="M-20,20 a20,18 0 0 1 40,0 z" fill="none" stroke="#1f2433" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- 흰 바탕: GitHub 다크 모드에서도 읽히게 한다 -->
  <rect width="1000" height="520" rx="16" fill="#ffffff"/>

  <!-- 개발자 -->
  <use href="#person" x="80" y="70"/>
  <text x="80" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">개발자</text>

  <!-- GitHub -->
  <circle cx="300" cy="68" r="28" fill="#1f2433"/>
  <g stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="291" y1="55" x2="291" y2="81"/>
    <path d="M309,59 v5 a9,9 0 0 1 -9,9 h-9"/>
  </g>
  <circle cx="291" cy="54" r="4" fill="#ffffff"/>
  <circle cx="291" cy="83" r="4" fill="#ffffff"/>
  <circle cx="309" cy="56" r="4" fill="#ffffff"/>
  <text x="300" y="120" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">GitHub</text>

  <!-- 배포 흐름 (점선) -->
  <line x1="118" y1="68" x2="262" y2="68" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="190" y="58" text-anchor="middle" font-size="13" fill="#5b6273">git push</text>
  <path d="M332,68 H790 V176" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="560" y="58" text-anchor="middle" font-size="13" fill="#5b6273">자동 배포</text>
  <path d="M80,140 V150 H400 V176" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/>
  <text x="240" y="142" text-anchor="middle" font-size="13" fill="#5b6273">wrangler deploy</text>

  <!-- 사용자 -->
  <g transform="translate(80,300)">
    <use href="#person" x="-24" y="-8"/>
    <use href="#person" x="24" y="-8"/>
    <g transform="translate(0,22)"><use href="#person"/></g>
  </g>
  <text x="80" y="370" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">사용자</text>
  <line x1="130" y1="290" x2="248" y2="290" stroke="#1f2433" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="189" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2433">HTTPS</text>

  <!-- 원본 사이트 -->
  <g transform="translate(80,462)">
    <circle r="22" fill="none" stroke="#1f2433" stroke-width="2.5"/>
    <ellipse rx="10" ry="22" fill="none" stroke="#1f2433" stroke-width="2"/>
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#1f2433" stroke-width="2"/>
  </g>
  <text x="80" y="504" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2433">원본 사이트</text>
  <line x1="80" y1="382" x2="80" y2="432" stroke="#1f2433" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="94" y="412" font-size="13" fill="#1f2433">301 이동</text>

  <!-- Cloudflare -->
  <rect x="250" y="180" width="300" height="250" rx="10" fill="#fff8f1" stroke="#f38020" stroke-width="2"/>
  <rect x="250" y="180" width="56" height="48" rx="10" fill="#f38020"/>
  <rect x="290" y="180" width="16" height="48" fill="#f38020"/>
  <path d="M263,214 a8,8 0 0 1 3,-15 a11,11 0 0 1 20,-4 a7,7 0 0 1 8,8 a5.5,5.5 0 0 1 0,11 z" fill="#ffffff"/>
  <text x="320" y="210" font-size="18" font-weight="700" fill="#1f2433">Cloudflare Workers</text>

  <rect x="275" y="248" width="250" height="60" rx="8" fill="#ffffff" stroke="#f6a35c" stroke-width="1.5"/>
  <text x="400" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">Worker</text>
  <text x="400" y="295" text-anchor="middle" font-size="13" fill="#5b6273">공개 주소 · 경로별 분기</text>

  <line x1="400" y1="308" x2="400" y2="346" stroke="#1f2433" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="332" font-size="12.5" fill="#5b6273">그 밖의 경로</text>

  <rect x="275" y="350" width="250" height="60" rx="8" fill="#ffffff" stroke="#f6a35c" stroke-width="1.5"/>
  <text x="400" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">웹 화면</text>
  <text x="400" y="397" text-anchor="middle" font-size="13" fill="#5b6273">Dioxus (WASM) 정적 파일</text>

  <!-- Worker ↔ 백엔드 -->
  <line x1="525" y1="278" x2="647" y2="278" stroke="#1f2433" stroke-width="2.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="600" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2433">프록시</text>
  <text x="600" y="298" text-anchor="middle" font-size="11.5" fill="#5b6273">/api/*, /{숫자}</text>

  <!-- Railway -->
  <rect x="650" y="180" width="300" height="250" rx="10" fill="#f7f4ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="650" y="180" width="56" height="48" rx="10" fill="#8b5cf6"/>
  <rect x="690" y="180" width="16" height="48" fill="#8b5cf6"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <line x1="669" y1="194" x2="669" y2="214"/>
    <line x1="687" y1="194" x2="687" y2="214"/>
    <line x1="664" y1="199" x2="692" y2="199"/>
    <line x1="664" y1="204" x2="692" y2="204"/>
    <line x1="664" y1="209" x2="692" y2="209"/>
  </g>
  <text x="720" y="210" font-size="18" font-weight="700" fill="#1f2433">Railway</text>

  <rect x="675" y="248" width="250" height="60" rx="8" fill="#ffffff" stroke="#2496ed" stroke-width="1.5"/>
  <text x="800" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">백엔드</text>
  <text x="800" y="295" text-anchor="middle" font-size="13" fill="#5b6273">Rust · Dioxus 서버 (Docker)</text>

  <line x1="800" y1="308" x2="800" y2="346" stroke="#1f2433" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="675" y="350" width="250" height="60" rx="8" fill="#ffffff" stroke="#336791" stroke-width="1.5"/>
  <text x="800" y="377" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2433">PostgreSQL</text>
  <text x="800" y="397" text-anchor="middle" font-size="13" fill="#5b6273">링크 저장</text>
</svg>
