[package]
name = "short_url"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.10", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# 브라우저(WASM) 전용
gloo-net = { version = "0.7", features = ["http", "json"], optional = true }

# 서버 전용 (WASM 빌드에는 들어가지 않는다)
anyhow = { version = "1", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "http1", "tokio"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "time"] }
sqlx = { version = "0.9", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-rustls-ring-webpki"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
web = ["dioxus/web", "dep:gloo-net"]
server = ["dioxus/server", "dep:anyhow", "dep:axum", "dep:tokio", "dep:sqlx"]

# 디스크 절약: 디버거 정보와 증분 캐시를 남기지 않는다 (패닉 위치 표시는 유지된다)
[profile.dev]
debug = 0
incremental = false
