<!DOCTYPE html>
<!--
  dx가 웹 번들의 index.html을 만들 때 쓰는 템플릿.
  제목 자리표시는 Dioxus.toml의 제목으로 바뀌고, 스타일과 스크립트는 dx가 head와 body 끝에 넣는다.
  (dx가 자리표시와 닫는 태그를 문자열로 찾으므로 이 주석에 그 문자열을 쓰지 않는다.)
-->
<html lang="ko">
    <head>
        <title>{app_title}</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="긴 URL을 숫자로만 된 짧은 주소로 바꿉니다. 로그인 없이 쓸 수 있습니다.">
        <meta name="color-scheme" content="light dark">
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ctext x='16' y='22.5' font-size='17' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3E%23%3C/text%3E%3C/svg%3E">
    </head>
    <body>
        <div id="main"></div>
        <!-- WASM을 받는 동안 보이는 안내. 화면이 그려지면 CSS로 숨긴다. -->
        <p class="boot">화면을 불러오는 중입니다…</p>
        <noscript><p class="boot">이 서비스는 JavaScript가 필요합니다.</p></noscript>
    </body>
</html>
